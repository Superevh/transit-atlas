<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- SLOT:title  filled by scripts/build.mjs from meta.title. Limit: 60 characters (28 for Chinese). -->
<title data-slot="title">{{TITLE}}</title>
<style id="atlas-style">
/* FIXED TOKENS. scripts/check.mjs compares this whole style block with the shipped template. */
:root{
  --paper:#F5ECD6;
  --paper-sheet:#FBF4E2;
  --river:#CFE3DC;
  --ink:#14161B;
  --ink-soft:#55534B;
  --rule:#14161B;
  --unknown:#FFD60A;
  --line-1:#D0241D;
  --line-2:#0B4EA2;
  --line-3:#087A41;
  --line-4:#EE6C00;
  --line-4-text:#B04F00;
  --line-5:#6B2C9E;
  --line-6:#007686;
  --line-7:#CB196F;
  --line-8:#7A4A1E;
  --font:"Helvetica Neue","Nimbus Sans","Liberation Sans",Arial,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
  --font-zh:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --t-quick:160ms;
  --t-move:380ms;
  --panel-w:296px;
  --dossier-w:384px;
}
html[lang^="zh"]{--font:var(--font-zh)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:500 14px/1.4 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
:focus-visible{outline:3px solid var(--line-2);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* map */
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.drag{cursor:grabbing}
.river{fill:none;stroke:var(--river);stroke-width:48;stroke-linejoin:round;stroke-linecap:butt}
.casing{fill:none;stroke:var(--paper);stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.seg{fill:none;stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round}
.link{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.casing.thin{stroke-width:9}
.c-inferred.seg{stroke-dasharray:15 8;stroke-linecap:butt}
.c-unknown.seg{stroke-dasharray:1 12}
.c-inferred.link{stroke-dasharray:12 7;stroke-linecap:butt}
.c-unknown.link{stroke-dasharray:1 9}
.l1{stroke:var(--line-1)}.l2{stroke:var(--line-2)}.l3{stroke:var(--line-3)}.l4{stroke:var(--line-4)}
.l5{stroke:var(--line-5)}.l6{stroke:var(--line-6)}.l7{stroke:var(--line-7)}.l8{stroke:var(--line-8)}
.f1{fill:var(--line-1)}.f2{fill:var(--line-2)}.f3{fill:var(--line-3)}.f4{fill:var(--line-4)}
.f5{fill:var(--line-5)}.f6{fill:var(--line-6)}.f7{fill:var(--line-7)}.f8{fill:var(--line-8)}
.chev{fill:var(--paper-sheet)}
.chev.thin{fill:var(--ink)}
.roundel .num{font:800 15px var(--font);fill:var(--paper-sheet);text-anchor:middle;dominant-baseline:central}
.roundel .ltag{font:800 14px var(--font);dominant-baseline:central;paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
.roundel.n4 .num{fill:var(--ink)}
.roundel .ltag.f4{fill:var(--line-4-text)}
.roundel .rim{fill:none;stroke:var(--paper-sheet);stroke-width:1.5}
.g-fill{fill:var(--paper-sheet);stroke:var(--ink);stroke-width:3.5}
.g-solid{fill:var(--ink);stroke:var(--ink);stroke-width:3.5}
.g-ring{fill:var(--paper-sheet);stroke:var(--ink);stroke-width:3.5}
.g-dash{fill:var(--paper-sheet);stroke:var(--ink);stroke-width:3;stroke-dasharray:3.2 3}
.st{cursor:pointer;outline:none}
.st .hit{fill:transparent}
.st .halo{fill:none;stroke:var(--ink);stroke-width:3;opacity:0}
.st.sel .halo{opacity:1;animation:ping 520ms var(--ease) 1}
.st:focus-visible .halo{opacity:1;stroke:var(--line-2)}
.st .lab{font:700 18px/1 var(--font);fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.st.sel .lab{font-weight:800}
.mark-bg{fill:var(--unknown)}
.st.s-unknown .lab{stroke:var(--unknown)}
.plate rect{stroke:var(--ink);stroke-width:2}
.plate text{font:800 13px var(--font);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.plate.p-unknown rect{fill:var(--unknown)}
.plate.p-inferred rect{fill:var(--paper-sheet)}
/* states */
.st,.seg,.link,.casing,.chev,.plate,.roundel{transition:opacity var(--t-quick) linear}
.dim{opacity:.13}
.off{display:none}
.st.off{display:inline}
.st.off>*{display:none}
.st.off.s-unknown>.plate,.st.off.s-unknown>.lab,.st.off.s-unknown>.mark-bg,.st.off.s-unknown>.hit{display:inline}
.intro .draw{stroke-dasharray:1;animation:draw 760ms var(--ease) both}
.intro .pop{animation:pop 300ms var(--ease) both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0}to{opacity:1}}
@keyframes ping{from{stroke-width:9;opacity:.2}to{stroke-width:3;opacity:1}}

/* panels: enamel signs with an ink header band */
.panel{background:var(--paper-sheet);border:2.5px solid var(--ink)}
.band{background:var(--ink);color:var(--paper-sheet);padding:7px 12px;font-weight:800;font-size:12px;letter-spacing:.08em;display:flex;justify-content:space-between;align-items:center;gap:8px}
#side{position:fixed;left:16px;top:16px;bottom:16px;width:var(--panel-w);display:flex;flex-direction:column;gap:10px;pointer-events:none;z-index:3}
#side>*{pointer-events:auto}
#plate{background:var(--ink);color:var(--paper-sheet);padding:14px 16px 13px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
#plate h1{margin:0;font-size:23px;line-height:1.12;font-weight:800;letter-spacing:-.012em}
#plate p{margin:5px 0 0;font-size:13px;line-height:1.35;color:#E8DFC8}
#stamp[hidden]{display:none}
#stamp{display:inline-block;margin-top:9px;background:var(--unknown);color:var(--ink);font-weight:800;font-size:12px;padding:2px 7px}
#legend{min-height:0;display:flex;flex-direction:column}
#legend .body{overflow:auto;padding:4px 0 8px}
#legend h2{margin:7px 12px 2px;font-size:12px;font-weight:800;color:var(--ink-soft);letter-spacing:.06em}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:1px 12px;min-height:26px;font-weight:700;font-size:14px;line-height:1.2}
.row:hover{background:var(--paper)}
.row svg{flex:none;display:block}
.row .n{margin-left:auto;font-weight:700;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.row[data-kind=type][aria-pressed="false"]{color:var(--ink-soft)}
.row[data-kind=type][aria-pressed="false"] svg{opacity:.28}
.row[data-kind=type][aria-pressed="false"] .nm{text-decoration:line-through}
.row.on{background:var(--ink);color:var(--paper-sheet)}
.row.on .n{color:var(--paper-sheet)}
#legend .row.static{cursor:default}
#legend .row.static:hover{background:none}
.hint{margin:2px 12px 4px;font-size:12px;line-height:1.3;font-weight:600;color:var(--ink-soft)}
.hint[hidden]{display:none}
#reset{font-weight:800;font-size:12px;color:var(--paper-sheet);text-decoration:underline;text-underline-offset:2px}
#reset[hidden]{display:none}

#tools{position:fixed;top:16px;right:16px;left:calc(var(--panel-w) + 32px);display:flex;gap:10px;justify-content:flex-end;align-items:flex-start;z-index:2;pointer-events:none;transition:right var(--t-move) var(--ease)}
#tools>*{pointer-events:auto}
body.dossier-open #tools{right:calc(var(--dossier-w) + 28px)}
#searchbox{position:relative;width:min(300px,100%);flex:0 1 300px}
#q{width:100%;height:42px;padding:0 12px 0 38px;border:2.5px solid var(--ink);background:var(--paper-sheet);font-weight:700;border-radius:0;appearance:none}
#q::placeholder{color:var(--ink-soft);opacity:1}
#searchbox>svg{position:absolute;left:11px;top:12px;pointer-events:none}
#results{position:absolute;left:0;right:0;top:44px;margin:0;padding:0;list-style:none;background:var(--paper-sheet);border:2.5px solid var(--ink);max-height:50vh;overflow:auto}
#results[hidden]{display:none}
#results li{display:flex;gap:9px;align-items:center;padding:8px 10px;font-weight:700;cursor:pointer;line-height:1.2}
#results li[aria-selected="true"],#results li:hover{background:var(--ink);color:var(--paper-sheet)}
#results li.none{cursor:default;color:var(--ink-soft);font-weight:600;background:none}
#results li small{margin-left:auto;font-size:12px;font-weight:600;opacity:.75;text-align:right}
.btn{height:42px;padding:0 13px;border:2.5px solid var(--ink);background:var(--paper-sheet);font-weight:800;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--ink);color:var(--paper-sheet)}
.pill{background:var(--unknown);color:var(--ink);padding:1px 7px;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
#legendbtn{display:none}
#zoom{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;z-index:2;transition:right var(--t-move) var(--ease)}
body.dossier-open #zoom{right:calc(var(--dossier-w) + 28px)}
#zoom button{width:46px;height:42px;background:var(--paper-sheet);border:2.5px solid var(--ink);margin-top:-2.5px;font-weight:800;font-size:20px;text-align:center;line-height:1}
#zoom button.txt{font-size:13px}
#zoom button:hover{background:var(--ink);color:var(--paper-sheet)}

#dossier{position:fixed;top:16px;right:16px;bottom:16px;width:var(--dossier-w);display:flex;flex-direction:column;z-index:4;transform:translateX(calc(100% + 24px));visibility:hidden;transition:transform var(--t-move) var(--ease),visibility 0s linear var(--t-move)}
#dossier.open{transform:none;visibility:visible;transition:transform var(--t-move) var(--ease)}
#dossier .scroll{overflow:auto;padding:14px 16px 18px;min-height:0;flex:1}
#dclose{color:var(--paper-sheet);font-weight:800;font-size:12px;text-decoration:underline;text-underline-offset:2px}
#dossier h2{margin:0;font-size:28px;line-height:1.08;font-weight:800;letter-spacing:-.012em}
#dossier h3{margin:18px 0 6px;font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--ink-soft);border-top:2.5px solid var(--ink);padding-top:8px;display:flex;justify-content:space-between}
.dmeta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:10px;font-weight:700;font-size:13px}
.badge{display:inline-flex;align-items:center;font-weight:800;font-size:12px;padding:2px 7px;border:2px solid var(--ink)}
.badge.fact{background:var(--ink);color:var(--paper-sheet)}
.badge.inferred{background:var(--paper-sheet)}
.badge.unknown{background:var(--unknown)}
.dnote{margin:12px 0 0;font-size:15px;line-height:1.45;font-weight:500}
.dbasis{margin:10px 0 0;padding:8px 10px;border-left:6px solid var(--ink);background:var(--paper);font-size:14px}
.dbasis.unknown{background:var(--unknown)}
.dbasis b{display:block;font-size:12px;font-weight:800}
.dline{display:flex;gap:8px;align-items:center;margin-top:6px;font-weight:700}
.rel{display:grid;grid-template-columns:30px 1fr auto;gap:2px 8px;align-items:center;width:100%;padding:8px 6px;border-bottom:1px solid #14161B33}
.rel:hover{background:var(--paper)}
.rel .v{grid-column:2;font-size:12px;font-weight:700;color:var(--ink-soft);line-height:1.2}
.rel .t{grid-column:2;font-size:15px;font-weight:800;line-height:1.2}
.rel .x{grid-column:2;font-size:13px;line-height:1.3;color:var(--ink-soft);font-weight:500}
.rel svg.ic{grid-column:1;grid-row:1/span 3}
.rel .mk{grid-column:3;grid-row:1/span 3}

#handoff{position:fixed;inset:16px;z-index:6;display:flex;flex-direction:column;box-shadow:0 0 0 100vmax #14161B66}
#handoff[hidden]{display:none}
#handoff .cols{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);overflow:auto}
#handoff section{padding:12px 16px 18px;border-right:2.5px solid var(--ink);min-width:0}
#handoff section:last-child{border-right:0;background:#FFF3A8}
#handoff section h2{margin:0 0 3px;font-size:22px;font-weight:800;display:flex;justify-content:space-between}
#handoff section>p{margin:0 0 8px;font-size:13px;color:var(--ink-soft);font-weight:600}
.hitem{display:block;width:100%;padding:8px 0;border-top:1px solid #14161B33}
.hitem:hover{background:#14161B0F}
.hitem b{display:block;font-size:14px;font-weight:800;line-height:1.25}
.hitem span{display:block;font-size:13px;line-height:1.35;margin-top:2px}
#h-lines{grid-column:1/-1;padding:10px 16px 14px;border-top:2.5px solid var(--ink);order:1}
#h-lines h2{margin:0 0 4px;font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--ink-soft)}
.hline{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:13px;line-height:1.3}
.hline svg{flex:none}
.hline b{font-weight:800;margin-right:4px}
#hclose{color:var(--paper-sheet);font-weight:800;font-size:12px;text-decoration:underline;text-underline-offset:2px}
#fatal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px;max-width:420px;z-index:9}
#fatal[hidden]{display:none}
#fatal pre{white-space:pre-wrap;font:600 13px var(--font);margin:8px 0 0}

@media (max-width:760px){
  :root{--panel-w:100%;--dossier-w:100%}
  #side{left:10px;right:10px;top:10px;bottom:auto;width:auto;gap:0}
  #plate{padding:9px 30px 9px 12px}
  #plate h1{font-size:17px}
  #plate p{display:none}
  #stamp{margin-top:4px;font-size:11px;padding:1px 6px}
  #tools{left:10px;right:62px;top:auto;bottom:10px;justify-content:flex-start;gap:6px;transition:none;z-index:5}
  body.dossier-open #tools{right:62px;visibility:hidden}
  #searchbox{flex:1 1 auto;width:auto}
  #q{padding:0 4px 0 34px;font-size:13px}
  #searchbox #results{position:fixed;left:10px;right:10px;top:auto;bottom:62px;max-height:44vh}
  .btn{padding:0 9px;font-size:13px}
  #handoff-l{display:none}
  #zoom button{width:46px;height:42px}
  #legendbtn{display:inline-flex}
  #legend{position:fixed;left:10px;right:10px;bottom:62px;max-height:64vh;display:none}
  body.legend-open #legend{display:flex}
  #zoom{right:10px;bottom:10px;transition:none;z-index:5}
  #zoom #zin,#zoom #zout{display:none}
  #zoom button{margin-top:0}
  body.dossier-open #zoom{display:none}
  body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:62px;background:var(--paper);border-top:2.5px solid var(--ink);z-index:1}
  #dossier{left:0;right:0;top:auto;bottom:0;width:auto;height:58vh;border-width:2.5px 0 0;transform:translateY(100%)}
  #dossier h2{font-size:23px}
  #handoff{inset:0}
  #handoff .cols{display:flex;flex-direction:column}
  #handoff section{flex:none}
  #handoff section[data-status=unknown]{order:-1}
  #handoff section{border-right:0;border-bottom:2.5px solid var(--ink)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<noscript><p data-slot="noscript">{{NOSCRIPT}}</p></noscript>

<svg id="map" xmlns="http://www.w3.org/2000/svg" role="application" tabindex="-1"><g id="vp"></g></svg>

<div id="side">
  <header id="plate">
    <h1 id="m-title"></h1>
    <p id="m-sub"></p>
    <span id="stamp" hidden></span>
  </header>
  <nav id="legend" class="panel">
    <div class="band"><span id="legend-h"></span><button id="reset" type="button" hidden></button></div>
    <div class="body" id="legend-body"></div>
  </nav>
</div>

<div id="tools">
  <div id="searchbox">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="7.5" cy="7.5" r="5.2" fill="none" stroke="#14161B" stroke-width="2.6"/><path d="M11.5 11.5 16 16" stroke="#14161B" stroke-width="2.6" stroke-linecap="round"/></svg>
    <input id="q" type="search" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="results">
    <ul id="results" role="listbox" hidden></ul>
  </div>
  <button id="legendbtn" class="btn" type="button" aria-expanded="false"></button>
  <button id="handoffbtn" class="btn" type="button"><span id="handoff-l"></span><span class="pill" id="unk-n"></span></button>
</div>

<div id="zoom">
  <button id="zin" type="button">+</button>
  <button id="zout" type="button">&#8722;</button>
  <button id="zfit" class="txt" type="button"></button>
</div>

<aside id="dossier" class="panel" aria-live="polite">
  <div class="band"><span id="d-kind"></span><button id="dclose" type="button"></button></div>
  <div class="scroll" id="d-body" tabindex="-1"></div>
</aside>

<div id="handoff" class="panel" role="dialog" aria-modal="true" aria-labelledby="h-title" hidden>
  <div class="band"><span id="h-title"></span><button id="hclose" type="button"></button></div>
  <div class="cols" id="h-cols"></div>
</div>

<div id="fatal" class="panel" role="alert" hidden><strong id="fatal-h"></strong><pre id="fatal-b"></pre></div>

<!-- SLOT:system  the only content slot: one JSON object with meta, lines, nodes, edges. Filled by scripts/build.mjs.
     Limits: 60 nodes, 8 lines, 120 edges; label 34 characters (16 for Chinese); note 240; basis 200; edge label 40. Schema in references/schema.md. -->
<script type="application/json" id="system-data" data-slot="system">{{SYSTEM_JSON}}</script>

<script id="atlas-layout">
/* Pure layout: same JSON in, same geometry out. No DOM, no randomness, no clock, input order ignored. */
(function(root){
'use strict';
var COL=158,ROW=132,PAD=44,TRACK_GAP=9.5,CORNER=20,LH=22,LABEL=18,FREE_W=888,FREE_H=716,MIN_LABEL=11;
function cmp(a,b){return a<b?-1:a>b?1:0}
function r2(n){return Math.round(n*100)/100}
function isCJK(ch){var c=ch.charCodeAt(0);return(c>=0x2E80&&c<=0x9FFF)||(c>=0xF900&&c<=0xFAFF)||(c>=0xFF00&&c<=0xFFEF)}
function textW(s){var w=0;for(var i=0;i<s.length;i++){var c=s[i];
  if(isCJK(c))w+=18.2;else if(c===' ')w+=5.2;else if(/[il.,:;'|!]/.test(c))w+=5.5;else if(/[A-Z]/.test(c))w+=12.8;else if(/[mw]/.test(c))w+=15.8;else w+=10.5}
  return w}
function wrap(label){
  var cjk=0;for(var i=0;i<label.length;i++)if(isCJK(label[i]))cjk++;
  var out=[];
  if(cjk>label.length/2){
    var per=label.length<=7?7:Math.ceil(label.length/2);
    for(var j=0;j<label.length;j+=per)out.push(label.slice(j,j+per));
    return out;
  }
  var words=label.split(/\s+/),cur='';
  words.forEach(function(w){var t=cur?cur+' '+w:w;if(t.length>13&&cur){out.push(cur);cur=w}else cur=t});
  if(cur)out.push(cur);
  return out;
}
function lineStops(line,edges){
  var own=edges.filter(function(e){return e.line===line.no});
  var into={},from={};
  own.forEach(function(e){into[e.to]=1;from[e.from]=e});
  var starts=own.map(function(e){return e.from}).filter(function(id){return !into[id]}).sort(cmp);
  var start=starts.length?starts[0]:(own.map(function(e){return e.from}).sort(cmp)[0]);
  var stops=[],es=[],cur=start,guard=0,seen={};
  if(start===undefined)return{stops:[],edges:[]};
  stops.push(cur);seen[cur]=1;
  while(from[cur]&&guard++<500){var e=from[cur];es.push(e);stops.push(e.to);cur=e.to;if(seen[cur])break;seen[cur]=1}
  return{stops:stops,edges:es,loop:stops.length>1&&stops[0]===stops[stops.length-1]};
}
function candidates(p,q){
  var base=basicCands(p,q),out=base.slice();
  /* a run along the clear channel between rows, entering and leaving at 45 degrees */
  var dxAll=Math.abs(q.x-p.x),sxAll=q.x<p.x?-1:1,chans=[];
  if(dxAll>=COL/2){
    if(Math.abs(p.y-q.y)>=ROW*.9)chans.push((p.y+q.y)/2);
    [p.y-ROW/2,p.y+ROW/2,q.y-ROW/2,q.y+ROW/2].forEach(function(y){if(chans.indexOf(y)<0)chans.push(y)});
    chans.forEach(function(yc,ci){
      var dp=Math.abs(yc-p.y),dq=Math.abs(yc-q.y);

var map=$('map'),cam={k:1,x:0,y:0},anim=0,KMIN=.12,KMAX=4;
function setCam(k,x,y){cam.k=k;cam.x=x;cam.y=y;vp.setAttribute('transform','translate('+x.toFixed(2)+' '+y.toFixed(2)+') scale('+k.toFixed(4)+')');map.dataset.k=k.toFixed(3);map.dataset.x=x.toFixed(1);map.dataset.y=y.toFixed(1)}
function moveCam(k,x,y,ms){
  cancelAnimationFrame(anim);
  if(!motionOK||!ms){setCam(k,x,y);return}
  var k0=cam.k,x0=cam.x,y0=cam.y,t0=performance.now();
  (function step(t){
    var u=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-u,3);
    setCam(k0+(k-k0)*e,x0+(x-x0)*e,y0+(y-y0)*e);
    if(u<1)anim=requestAnimationFrame(step);
  })(t0);
}
function phone(){return window.innerWidth<=760}
function safe(){
  var w=window.innerWidth,hh=window.innerHeight,r={l:0,t:0,r:w,b:hh},open=$('dossier').classList.contains('open');
  if(phone()){r.t=$('side').getBoundingClientRect().bottom+6;r.b=(open?hh-$('dossier').offsetHeight:hh-62)-6;}
  else{r.l=$('side').getBoundingClientRect().right+10;r.t=70;r.b=hh-14;r.r=(open?w-$('dossier').offsetWidth-84:w-70)}
  return r;
}
function fit(ms,opening){
  var r=safe(),w=r.r-r.l,hh=r.b-r.t,k=Math.min(w/box.w,hh/box.h,1.05);
  if(phone()&&opening){
    /* a phone opens at reading size on the left end of the map; pan or Fit from there */
    k=Math.max(k,Math.max(.62,Math.min(.72,hh/box.h)));
    var marks=[];
    SYS.nodes.forEach(function(n){if(n.status==='unknown')marks.push({x:L.nodes[n.id].x,y:L.nodes[n.id].y})});
    L.segs.forEach(function(g){if(g.status==='unknown')marks.push({x:g.mid.x,y:g.mid.y})});
    marks.sort(function(a,b){return a.x-b.x||a.y-b.y});
    var ox=8-box.x*k,oy=(r.t+r.b)/2-(box.y+box.h/2)*k;
    if(marks.length){
      var m=marks[0];
      if(m.x*k+ox>r.r-90)ox=r.r*.62-m.x*k;
      var sy=m.y*k+oy;
      if(sy<r.t+50||sy>r.b-70)oy=(r.t+r.b)/2-m.y*k;
    }
    moveCam(k,ox,oy,ms);
    return;
  }
  moveCam(k,r.l+(w-box.w*k)/2-box.x*k,r.t+(hh-box.h*k)/2-box.y*k,ms);
}
function zoomAt(f,cx,cy,ms){
  var k=Math.max(KMIN,Math.min(KMAX,cam.k*f)),a=k/cam.k;
  moveCam(k,cx-(cx-cam.x)*a,cy-(cy-cam.y)*a,ms);

function centreOn(id,ms){
  /* frame the station with everything it connects to, so both ends of a long link are on screen */
  var n=L.nodes[id],r=safe(),want=Math.max(cam.k,phone()?.82:.95),floor=phone()?.45:Math.min(cam.k,.3);
  var x0=n.x,x1=n.x,y0=n.y,y1=n.y;
  Object.keys(neighbours(id)).forEach(function(o){var m=L.nodes[o];x0=Math.min(x0,m.x);x1=Math.max(x1,m.x);y0=Math.min(y0,m.y);y1=Math.max(y1,m.y)});
  var pad=70,fit=Math.min((r.r-r.l)/(x1-x0+2*pad),(r.b-r.t)/(y1-y0+2*pad));
  var k=Math.max(floor,Math.min(want,fit));
  if(k>fit+1e-6){moveCam(k,(r.l+r.r)/2-n.x*k,(r.t+r.b)/2-n.y*k,ms);return}
  moveCam(k,(r.l+r.r)/2-(x0+x1)/2*k,(r.t+r.b)/2-(y0+y1)/2*k,ms);
}
